name: upload-screenshots
on:
  push:
    paths:
      - '.github/workflows/upload-screenshots.yml'
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download screenshots
        run: |
          set -euo pipefail
          mkdir -p screenshots
          curl -fsSL -o screenshots/1-board.png 'https://muse.ai/files/1315124875021127/1673706197573563/rk8jdmu0r7iia5z2ldkkuzzu/1-board.png'
          curl -fsSL -o screenshots/2-detail.png 'https://muse.ai/files/1315124875021127/1493143675998575/409ly5dl0or03avj5nfr1ol5/2-detail.png'
          curl -fsSL -o screenshots/3-filtered.png 'https://muse.ai/files/1315124875021127/4374639252826812/q6gbltu6w3p4ukd1k6j6ezsc/3-filtered.png'
          echo 'da0460d3e3650b54873ebc550088f8c228773e1e7c82b691b7c61ab22c91882d  screenshots/1-board.png' | sha256sum -c -
          echo '74d29baa4dae7e9dde36a22d39818e9147291e44240f8a70ddc9538d409768f2  screenshots/2-detail.png' | sha256sum -c -
          echo 'e28c37b71024f6dc825a02d3730969d5af76513e92a19cbeb128d49f734bd99a  screenshots/3-filtered.png' | sha256sum -c -
          test "$(stat -c %s screenshots/1-board.png)" = 156763
          test "$(stat -c %s screenshots/2-detail.png)" = 198778
          test "$(stat -c %s screenshots/3-filtered.png)" = 157914
          ls -l screenshots/
      - name: Commit screenshots
        run: |
          set -euo pipefail
          git config user.name 'muse'
          git config user.email 'muse@users.noreply.github.com'
          git add screenshots/
          git commit -m 'Add dashboard screenshots (3 PNGs)' || echo 'nothing to commit'
          git push
